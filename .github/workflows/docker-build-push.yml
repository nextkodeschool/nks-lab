name: Docker Build And Push

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to push
        required: true
        default: latest
  push:
    branches: ["main"]
    paths:
      - "database/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/docker-build-push.yml"

permissions:
  contents: read

env:
  # Docker Hub username is read from GitHub Actions Secrets.
  IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.sha }}

jobs:
  build-and-push:
    name: Build And Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push database image
        uses: docker/build-push-action@v6
        with:
          context: ./database
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/nextkode-deploylab-database:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKER_USERNAME }}/nextkode-deploylab-database:latest

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/nextkode-deploylab-backend:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKER_USERNAME }}/nextkode-deploylab-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/nextkode-deploylab-frontend:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKER_USERNAME }}/nextkode-deploylab-frontend:latest


name: Terraform AWS Infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      backend_image_tag:
        description: Backend image tag for ECS task definition
        required: true
        default: latest
      backend_desired_count:
        description: Use 0 before image push, 1 after backend image exists
        required: true
        default: "0"

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  APP_NAME: ${{ vars.APP_NAME || 'nextkode-deploylab' }}
  ENVIRONMENT: ${{ vars.ENVIRONMENT || 'lab' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_LOCK_TABLE: ${{ vars.TF_STATE_LOCK_TABLE }}
  TF_INPUT: false
  TF_IN_AUTOMATION: true
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'ap-south-1' }}
  TF_VAR_app_name: ${{ vars.APP_NAME || 'nextkode-deploylab' }}
  TF_VAR_environment: ${{ vars.ENVIRONMENT || 'lab' }}
  TF_VAR_backend_image_tag: ${{ inputs.backend_image_tag }}
  TF_VAR_backend_desired_count: ${{ inputs.backend_desired_count }}

jobs:
  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check remote state settings
        run: |
          # Remote state keeps Terraform history between workflow runs.
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "Missing repository variable: TF_STATE_BUCKET"
            exit 1
          fi
          if [ -z "$TF_STATE_LOCK_TABLE" ]; then
            echo "Missing repository variable: TF_STATE_LOCK_TABLE"
            exit 1
          fi

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: |
          # Backend config points Terraform state to S3 with DynamoDB locking.
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${APP_NAME}/${ENVIRONMENT}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_STATE_LOCK_TABLE}" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        env:
          # Sensitive Terraform variables come from GitHub Actions Secrets.
          TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_admin_password: ${{ secrets.ADMIN_PASSWORD }}
          TF_VAR_student1_password: ${{ secrets.STUDENT1_PASSWORD }}
          TF_VAR_student2_password: ${{ secrets.STUDENT2_PASSWORD }}
        run: terraform plan -out=tfplan

      - name: Terraform apply
        if: ${{ inputs.action == 'apply' }}
        run: |
          # Apply creates or updates the AWS infrastructure.
          terraform apply -auto-approve tfplan

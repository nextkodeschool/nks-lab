apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nextkode-lab.fullname" . }}-secret
  labels:
    {{- include "nextkode-lab.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Values come from values.yaml; CI/CD overrides them from GitHub Actions Secrets.
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  STUDENT1_PASSWORD: {{ .Values.secrets.student1Password | quote }}
  STUDENT2_PASSWORD: {{ .Values.secrets.student2Password | quote }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    {{- include "nextkode-lab.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
      {{- include "nextkode-lab.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: backend
        {{- include "nextkode-lab.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          # FastAPI reads progress from PostgreSQL.
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
          env:
            # Sensitive values come from Secret; normal values from ConfigMap.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "nextkode-lab.fullname" . }}-secret
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "nextkode-lab.fullname" . }}-secret
                  key: JWT_SECRET
            - name: JWT_EXPIRE_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: {{ include "nextkode-lab.fullname" . }}-config
                  key: JWT_EXPIRE_MINUTES
            - name: ADMIN_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "nextkode-lab.fullname" . }}-config
                  key: ADMIN_USERNAME
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nextkode-lab.fullname" . }}-secret
                  key: ADMIN_PASSWORD
            - name: STUDENT1_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "nextkode-lab.fullname" . }}-config
                  key: STUDENT1_USERNAME
            - name: STUDENT1_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nextkode-lab.fullname" . }}-secret
                  key: STUDENT1_PASSWORD
            - name: STUDENT2_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "nextkode-lab.fullname" . }}-config
                  key: STUDENT2_USERNAME
            - name: STUDENT2_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nextkode-lab.fullname" . }}-secret
                  key: STUDENT2_PASSWORD
          readinessProbe:
            # Readiness checks API and database connectivity.
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.backend.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.probes.readiness.failureThreshold }}
          livenessProbe:
            # Liveness restarts backend if the health endpoint fails.
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.backend.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.probes.liveness.failureThreshold }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backend.service.name }}
  labels:
    {{- include "nextkode-lab.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  # Frontend proxies API calls to this service name.
  type: {{ .Values.backend.service.type }}
  selector:
    app.kubernetes.io/component: backend
    {{- include "nextkode-lab.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http

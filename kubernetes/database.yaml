apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: nextkode-lab
spec:
  # PVC keeps database data after the pod restarts.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  namespace: nextkode-lab
  labels:
    app: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
        - name: database
          # Replace image owner/tag manually or through GitHub Actions.
          image: your-dockerhub-username/nextkode-deploylab-database:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            # ConfigMap has normal values; Secret has passwords.
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: nextkode-lab-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: nextkode-lab-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextkode-lab-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            # Readiness tells Kubernetes when PostgreSQL can accept traffic.
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            # Liveness restarts PostgreSQL if it stops responding.
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: database
  namespace: nextkode-lab
spec:
  # ClusterIP exposes PostgreSQL only inside the cluster.
  type: ClusterIP
  selector:
    app: database
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

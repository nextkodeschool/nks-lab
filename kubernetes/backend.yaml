apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: nextkode-lab
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # Backend image is pushed by Docker workflow and deployed here.
          image: your-dockerhub-username/nextkode-deploylab-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            # Sensitive values come from Secret; normal values from ConfigMap.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nextkode-lab-secret
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nextkode-lab-secret
                  key: JWT_SECRET
            - name: JWT_EXPIRE_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: nextkode-lab-config
                  key: JWT_EXPIRE_MINUTES
            - name: ADMIN_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: nextkode-lab-config
                  key: ADMIN_USERNAME
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextkode-lab-secret
                  key: ADMIN_PASSWORD
            - name: STUDENT1_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: nextkode-lab-config
                  key: STUDENT1_USERNAME
            - name: STUDENT1_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextkode-lab-secret
                  key: STUDENT1_PASSWORD
            - name: STUDENT2_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: nextkode-lab-config
                  key: STUDENT2_USERNAME
            - name: STUDENT2_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextkode-lab-secret
                  key: STUDENT2_PASSWORD
          readinessProbe:
            # Readiness waits until FastAPI and database health are good.
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            # Liveness restarts backend if the health endpoint fails.
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: nextkode-lab
spec:
  # Frontend reaches the API by this service name: http://backend:8000.
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
